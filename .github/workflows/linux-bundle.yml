# Builds the Linux test bundle (tools/linux-bundle/) on request: mmodern
# for x86-64 Linux with its non-system libraries, a start script, the GPL
# notice with the source commit and the tester's guide, as a downloadable
# artifact. It is built in an Ubuntu 22.04 container (glibc 2.35) pinned by
# digest, with every package pinned by .github/ci/linux-bundle-packages.txt,
# so it runs on most current distributions. Its SDL2 (2.0.20) lacks
# SDL_GetDefaultAudioInfo, so the job builds and bundles the pinned SDL2
# release that Windows and CI use (tools/linux-bundle/build-sdl2.sh). It is not
# a release package and runs no tests; the CI workflow tests the same source.
name: Linux test bundle

on:
  workflow_dispatch:
  # TEMPORARY, work branch m113-ci-red only: runs the bundle job with the
  # red/green CI proof before this workflow is on main. Not part of main.
  push:
    branches: [m113-ci-red]

concurrency:
  group: linux-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCUMMVM_COMMIT: 6814ee9ba54582f5b5adcffab49efbbd8f589edd

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
      # The image has no CA certificates; .github/ci/linux-apt.sh uses the
      # runner's bundle only to reach snapshot.ubuntu.com over HTTPS.
      volumes:
        - /etc/ssl/certs/ca-certificates.crt:/host-ca.crt:ro
    env:
      MMODERN_CI_CA_FILE: /host-ca.crt
    defaults:
      run:
        shell: bash
    steps:
      # Without Git in the image this checkout downloads the files only; the
      # package list is all the next step needs.
      - name: Check out the package list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned packages
        run: bash .github/ci/linux-apt.sh .github/ci/linux-bundle-packages.txt

      # Now with Git, which the item-catalog generator needs.
      - name: Check out MMModern
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ScummVM's configure and make-bundle.sh then find this SDL2, the only
      # one in the container.
      - name: Build the pinned SDL2
        run: |
          set -euo pipefail
          bash tools/linux-bundle/build-sdl2.sh "$RUNNER_TEMP/sdl2-work" "$RUNNER_TEMP/sdl2"
          echo "$RUNNER_TEMP/sdl2/bin" >> "$GITHUB_PATH"

      - name: Fetch ScummVM at the pinned commit
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/scummvm-src"
          git init --quiet "$source"
          git -C "$source" remote add origin https://github.com/scummvm/scummvm.git
          git -C "$source" fetch --depth 1 --no-tags origin "$SCUMMVM_COMMIT"
          git -C "$source" checkout --quiet --detach FETCH_HEAD
          head=$(git -C "$source" rev-parse HEAD)
          status=$(git -C "$source" status --porcelain)
          echo "ScummVM HEAD: $head"
          echo "ScummVM status --porcelain: ${status:-(empty)}"
          [ "$head" = "$SCUMMVM_COMMIT" ] || { echo "::error::ScummVM HEAD is not the pinned commit."; exit 1; }
          [ -z "$status" ] || { echo "::error::The ScummVM checkout is not clean."; exit 1; }

      # Ubuntu 22.04 has no sndio, so its USE_ set is recorded on its own;
      # MMModern's configure checks the DEFINES as in the CI job.
      - name: Configure and build the four ScummVM artifacts
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/scummvm-build"
          [ "$(command -v sdl2-config)" = "$RUNNER_TEMP/sdl2/bin/sdl2-config" ] || { echo "::error::sdl2-config is not the pinned SDL2."; exit 1; }
          bash .github/ci/scummvm.sh configure "$RUNNER_TEMP/scummvm-src" "$build"
          { grep -E 'USE_' "$build/config.h"; grep -E 'USE_' "$build/config.mk"; } > "$RUNNER_TEMP/use-actual.txt"
          grep -v '^##' .github/ci/scummvm-use-linux-bundle.txt > "$RUNNER_TEMP/use-expected.txt"
          if ! cmp -s "$RUNNER_TEMP/use-expected.txt" "$RUNNER_TEMP/use-actual.txt"; then
            echo 'Only expected (<), only found (>):'
            diff "$RUNNER_TEMP/use-expected.txt" "$RUNNER_TEMP/use-actual.txt" || true
            echo "::error::ScummVM's USE_ set differs from .github/ci/scummvm-use-linux-bundle.txt."
            exit 1
          fi
          echo "ScummVM's USE_ set matches the recorded set; defined:"
          grep -E '^#define USE_' "$build/config.h"
          grep -E '^DEFINES' "$build/config.mk"
          bash .github/ci/scummvm.sh build "$RUNNER_TEMP/scummvm-src" "$build"

      - name: Build the bundle
        run: bash tools/linux-bundle/make-bundle.sh "$RUNNER_TEMP/scummvm-src" "$RUNNER_TEMP/scummvm-build" "$RUNNER_TEMP/sdl2" bundle-out "$GITHUB_SHA"

      # The archive keeps the start script's executable bit, which the
      # artifact's own zip would lose.
      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mmodern-linux-test
          path: |
            bundle-out/mmodern-linux-test-*.tar.gz
            bundle-out/mmodern-linux-test-*.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error
