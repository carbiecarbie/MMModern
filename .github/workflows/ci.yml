# Builds MMModern on a clean Windows machine and in a clean Linux container
# from the repository and docs/dependencies.md alone, and runs the tests that
# need no original data (MMODERN_ORIGINAL_DATA_TESTS=OFF). It never replaces
# the complete local suites. The pinned toolchains are
# .github/ci/msys2-packages.txt and .github/ci/linux-packages.txt, the ScummVM
# configure and build commands .github/ci/scummvm.sh and the expected ScummVM
# configurations .github/ci/scummvm-use.txt, .github/ci/scummvm-use-linux.txt
# and .github/ci/scummvm-defines-linux.txt; change them and
# docs/dependencies.md together.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push cancels the older run of the same branch. On main every commit
# gets its own group and nothing is cancelled, so each keeps its own result.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  SCUMMVM_COMMIT: 6814ee9ba54582f5b5adcffab49efbbd8f589edd
  MSYS2_REPO: https://repo.msys2.org

jobs:
  build-and-test:
    # Branches of this repository already run on push; pull requests run
    # only when they come from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Check out MMModern
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MSYS2
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          path-type: minimal

      - name: Set paths
        shell: pwsh
        run: |
          $msys = '${{ steps.msys2.outputs.msys2-location }}'
          $temp = '${{ runner.temp }}'
          $git = 'C:\Program Files\Git\cmd'
          "MSYS2_ROOT=$msys" >> $env:GITHUB_ENV
          "PKG_DIR=$temp\msys2-pkgs" >> $env:GITHUB_ENV
          "SCUMMVM_SOURCE=$temp\scummvm-src" >> $env:GITHUB_ENV
          "SCUMMVM_BUILD=$temp\scummvm-build" >> $env:GITHUB_ENV
          "GIT_FOR_WINDOWS=$git\git.exe" >> $env:GITHUB_ENV
          # The PATH of the MMModern steps: the UCRT64 toolchain first, as in
          # docs/dependencies.md, then Git for Windows and Windows itself, so
          # the image's other MinGW DLLs are never found.
          "MMODERN_CI_PATH=$msys\ucrt64\bin;$git;C:\Windows\System32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0" >> $env:GITHUB_ENV

      - name: Restore pinned package files
        id: pkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PKG_DIR }}
          key: msys2-pkgs-${{ hashFiles('.github/ci/msys2-packages.txt') }}

      - name: Download and verify pinned package files
        shell: msys2 {0}
        run: |
          set -eu
          dir=$(cygpath -u "$PKG_DIR")
          mkdir -p "$dir"
          grep -vE '^(#|$)' .github/ci/msys2-packages.txt | while read -r sum file stage; do
            case "$file" in
              mingw-w64-ucrt-x86_64-*) url="$MSYS2_REPO/mingw/ucrt64/$file" ;;
              *) url="$MSYS2_REPO/msys/x86_64/$file" ;;
            esac
            if [ ! -f "$dir/$file" ] && ! curl -fsSL --retry 3 -o "$dir/$file" "$url"; then
              echo "::error::Could not download $file from $url."
              exit 1
            fi
            if ! echo "$sum  $dir/$file" | sha256sum -c --quiet; then
              echo "::error::$file does not match its pinned SHA-256."
              exit 1
            fi
          done
          echo "All $(grep -vcE '^(#|$)' .github/ci/msys2-packages.txt) package files match their SHA-256."

      - name: Save pinned package files
        if: steps.pkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PKG_DIR }}
          key: ${{ steps.pkg-cache.outputs.cache-primary-key }}

      - name: Install the pinned toolchain (before ScummVM's configure)
        shell: msys2 {0}
        run: |
          set -eu
          dir=$(cygpath -u "$PKG_DIR")
          files=$(grep -vE '^(#|$)' .github/ci/msys2-packages.txt | awk -v d="$dir" '$3 != "after-scummvm" { print d "/" $2 }')
          pacman -U --noconfirm $files
          # Nothing beyond the pinned files may be installed into UCRT64.
          expected=$(for f in $files; do pacman -Qp "$f"; done | grep '^mingw-w64-ucrt-x86_64-' | sort)
          actual=$(pacman -Q | grep '^mingw-w64-ucrt-x86_64-' | sort)
          if [ "$expected" != "$actual" ]; then
            echo "$expected" > /tmp/expected.txt
            echo "$actual" > /tmp/actual.txt
            # MSYS2's base has no diff; comm (coreutils) lists the differing lines.
            sort /tmp/expected.txt > /tmp/expected.sorted
            sort /tmp/actual.txt > /tmp/actual.sorted
            echo 'Only expected (left), only found (right):'
            comm -3 /tmp/expected.sorted /tmp/actual.sorted || true
            echo "::error::The installed UCRT64 packages differ from the pinned set."
            exit 1
          fi

      - name: Check that docs/dependencies.md lists exactly the pinned packages
        shell: msys2 {0}
        run: |
          set -eu
          dir=$(cygpath -u "$PKG_DIR")
          for file in $(grep -vE '^(#|$)' .github/ci/msys2-packages.txt | awk '{ print $2 }'); do
            pacman -Qp "$dir/$file"
          done | sort > /tmp/pinned.txt
          # The first fenced block after the "Pinned MSYS2 package set" heading.
          awk '/^### Pinned MSYS2 package set/ { section = 1; next }
            section && /^```/ { if (inside) exit; inside = 1; next }
            inside { print }' docs/dependencies.md | sort > /tmp/documented.txt
          if [ "$(cat /tmp/pinned.txt)" != "$(cat /tmp/documented.txt)" ]; then
            echo 'Only pinned (left), only documented (right):'
            comm -3 /tmp/pinned.txt /tmp/documented.txt || true
            echo "::error::The package list in docs/dependencies.md differs from .github/ci/msys2-packages.txt."
            exit 1
          fi
          echo "docs/dependencies.md lists the $(wc -l < /tmp/pinned.txt) pinned packages."

      - name: Fetch ScummVM at the pinned commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $git = $env:GIT_FOR_WINDOWS
          & $git init --quiet $env:SCUMMVM_SOURCE
          & $git -C $env:SCUMMVM_SOURCE remote add origin https://github.com/scummvm/scummvm.git
          & $git -C $env:SCUMMVM_SOURCE fetch --depth 1 --no-tags origin $env:SCUMMVM_COMMIT
          & $git -C $env:SCUMMVM_SOURCE checkout --quiet --detach FETCH_HEAD
          $head = & $git -C $env:SCUMMVM_SOURCE rev-parse HEAD
          $status = & $git -C $env:SCUMMVM_SOURCE status --porcelain
          "ScummVM HEAD: $head"
          "ScummVM status --porcelain: $(if ($status) { $status } else { '(empty)' })"
          if ($head -ne $env:SCUMMVM_COMMIT) { throw "ScummVM HEAD is not the pinned commit." }
          if ($status) { throw 'The ScummVM checkout is not clean.' }

      - name: Restore the ScummVM build
        id: scummvm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCUMMVM_BUILD }}
          key: scummvm-${{ env.SCUMMVM_COMMIT }}-${{ hashFiles('.github/ci/msys2-packages.txt', '.github/ci/scummvm.sh', '.github/ci/scummvm-use.txt') }}

      - name: Configure ScummVM
        if: steps.scummvm-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash .github/ci/scummvm.sh configure "$(cygpath -u "$SCUMMVM_SOURCE")" "$(cygpath -u "$SCUMMVM_BUILD")"

      - name: Check the ScummVM USE_ set
        shell: msys2 {0}
        run: |
          set -eu
          build=$(cygpath -u "$SCUMMVM_BUILD")
          actual=$( { grep -E 'USE_' "$build/config.h"; grep -E 'USE_' "$build/config.mk"; } )
          expected=$(grep -v '^##' .github/ci/scummvm-use.txt)
          if [ "$expected" != "$actual" ]; then
            echo "$expected" > /tmp/expected.txt
            echo "$actual" > /tmp/actual.txt
            # MSYS2's base has no diff; comm (coreutils) lists the differing lines.
            sort /tmp/expected.txt > /tmp/expected.sorted
            sort /tmp/actual.txt > /tmp/actual.sorted
            echo 'Only expected (left), only found (right):'
            comm -3 /tmp/expected.sorted /tmp/actual.sorted || true
            echo "::error::ScummVM's USE_ set differs from .github/ci/scummvm-use.txt."
            exit 1
          fi
          echo "ScummVM's USE_ set matches the recorded set; defined:"
          grep -E '^#define USE_' "$build/config.h"

      - name: Build the four ScummVM artifacts
        if: steps.scummvm-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash .github/ci/scummvm.sh build "$(cygpath -u "$SCUMMVM_SOURCE")" "$(cygpath -u "$SCUMMVM_BUILD")"

      - name: Save the ScummVM build
        if: steps.scummvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCUMMVM_BUILD }}
          key: ${{ steps.scummvm-cache.outputs.cache-primary-key }}

      - name: Install the packages that follow ScummVM's configure
        shell: msys2 {0}
        run: |
          set -eu
          dir=$(cygpath -u "$PKG_DIR")
          files=$(grep -vE '^(#|$)' .github/ci/msys2-packages.txt | awk -v d="$dir" '{ print d "/" $2 }')
          late=$(grep -vE '^(#|$)' .github/ci/msys2-packages.txt | awk -v d="$dir" '$3 == "after-scummvm" { print d "/" $2 }')
          if [ -z "$late" ]; then
            echo "::error::.github/ci/msys2-packages.txt marks no package after-scummvm; libvorbis and libogg must follow ScummVM's configure."
            exit 1
          fi
          pacman -U --noconfirm $late
          expected=$(for f in $files; do pacman -Qp "$f"; done | grep '^mingw-w64-ucrt-x86_64-' | sort)
          actual=$(pacman -Q | grep '^mingw-w64-ucrt-x86_64-' | sort)
          if [ "$expected" != "$actual" ]; then
            echo "$expected" > /tmp/expected.txt
            echo "$actual" > /tmp/actual.txt
            # MSYS2's base has no diff; comm (coreutils) lists the differing lines.
            sort /tmp/expected.txt > /tmp/expected.sorted
            sort /tmp/actual.txt > /tmp/actual.sorted
            echo 'Only expected (left), only found (right):'
            comm -3 /tmp/expected.sorted /tmp/actual.sorted || true
            echo "::error::The installed UCRT64 packages differ from the pinned set."
            exit 1
          fi

      - name: Show the toolchain
        shell: msys2 {0}
        run: |
          set -eu
          echo '--- pinned packages installed'
          pacman -Q | grep '^mingw-w64-ucrt-x86_64-'
          pacman -Q make msys2-runtime
          echo '--- tool versions'
          gcc --version | head -1
          ld --version | head -1
          objcopy --version | head -1
          cmake --version | head -1
          echo "ninja $(ninja --version)"
          make --version | head -1
          echo "SDL2 $(sdl2-config --version)"
          "$(cygpath -u "$GIT_FOR_WINDOWS")" --version

      - name: Free disk before the MMModern build
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='Free GB';e={[math]::Round($_.Free / 1GB, 1)}}, @{n='Used GB';e={[math]::Round($_.Used / 1GB, 1)}}

      - name: Configure MMModern (as build-rel, without original data)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = $env:MMODERN_CI_PATH
          cmake -S . -B build-rel -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g" `
            "-DSCUMMVM_SOURCE_DIR=$($env:SCUMMVM_SOURCE -replace '\\','/')" `
            "-DSCUMMVM_BUILD_DIR=$($env:SCUMMVM_BUILD -replace '\\','/')" `
            "-DGIT_EXECUTABLE=$($env:GIT_FOR_WINDOWS -replace '\\','/')" `
            -DMMODERN_ORIGINAL_DATA_TESTS=OFF
          if (Select-String -Path build-rel/build.ninja -Pattern 'NDEBUG' -SimpleMatch -Quiet) {
            throw 'build-rel/build.ninja contains NDEBUG.'
          }
          'build-rel/build.ninja contains no NDEBUG.'

      - name: Build MMModern
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = $env:MMODERN_CI_PATH
          cmake --build build-rel
          # The EXCLUDE_FROM_ALL targets, so every documented target compiles;
          # CMakeLists.txt points here where it defines them.
          cmake --build build-rel --target mmodern_test_save mmodern_dos_export mmodern_m44_baseline_witness mmodern_m44_baseline_restart

      - name: Free disk after the MMModern build
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='Free GB';e={[math]::Round($_.Free / 1GB, 1)}}, @{n='Used GB';e={[math]::Round($_.Used / 1GB, 1)}}

      - name: Show the DLLs found first on PATH
        shell: pwsh
        run: |
          $env:PATH = $env:MMODERN_CI_PATH
          foreach ($dll in 'libstdc++-6.dll', 'SDL2.dll') {
            $found = @(where.exe $dll 2>$null)
            if (-not $found) { throw "$dll is not on PATH." }
            "$dll -> $($found[0])"
          }

      - name: Run the tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = $env:MMODERN_CI_PATH
          ctest --test-dir build-rel --output-on-failure --no-tests=error -j $env:NUMBER_OF_PROCESSORS

      - name: Upload the CTest logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-logs
          path: build-rel/Testing/Temporary/
          retention-days: 7
          if-no-files-found: ignore

  # The same build and data-free tests natively on Linux, in an Ubuntu 26.04
  # container pinned by digest, with every package pinned by
  # .github/ci/linux-packages.txt (a snapshot.ubuntu.com timestamp and the
  # exact installed set) and the ScummVM configuration by
  # .github/ci/scummvm-use-linux.txt and .github/ci/scummvm-defines-linux.txt.
  # MMModern and ScummVM are built and tested as an unprivileged user, so the
  # permission cases that skip under root run too.
  linux-build-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
      # The image has no CA certificates; .github/ci/linux-apt.sh uses the
      # runner's bundle only to reach snapshot.ubuntu.com over HTTPS.
      volumes:
        - /etc/ssl/certs/ca-certificates.crt:/host-ca.crt:ro
    env:
      MMODERN_CI_CA_FILE: /host-ca.crt
      SCUMMVM_SOURCE: /home/builder/scummvm-src
      SCUMMVM_BUILD: /home/builder/scummvm-build
    defaults:
      run:
        shell: bash
    steps:
      # Without Git in the image this checkout downloads the files only; the
      # package list is all the next step needs.
      - name: Check out the package list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The cache holds a verified local mirror of the packages, so a run
      # needs snapshot.ubuntu.com only when the list or the image changes.
      - name: Name the package cache
        id: apt-key
        run: echo "key=$(bash .github/ci/linux-apt.sh key .github/ci/linux-packages.txt)" >> "$GITHUB_OUTPUT"

      - name: Restore the package cache
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/mmodern-apt
          key: ${{ steps.apt-key.outputs.key }}

      - name: Download the pinned packages
        run: bash .github/ci/linux-apt.sh fetch .github/ci/linux-packages.txt /var/cache/mmodern-apt

      - name: Save the package cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/mmodern-apt
          key: ${{ steps.apt-key.outputs.key }}

      - name: Install the pinned packages
        run: bash .github/ci/linux-apt.sh install .github/ci/linux-packages.txt /var/cache/mmodern-apt

      # The documented list is the packages asked for; the list file also
      # pins everything apt resolves from them.
      - name: Check that docs/dependencies.md lists exactly the requested packages
        run: |
          set -euo pipefail
          awk '$3 == "install" { print $1, $2 }' .github/ci/linux-packages.txt | sort > /tmp/pinned.txt
          # The first fenced block after the "Pinned Ubuntu package set" heading.
          awk '/^### Pinned Ubuntu package set/ { section = 1; next }
            section && /^```/ { if (inside) exit; inside = 1; next }
            inside { print }' docs/dependencies.md | sort > /tmp/documented.txt
          if ! cmp -s /tmp/pinned.txt /tmp/documented.txt; then
            echo 'Only pinned (<), only documented (>):'
            diff /tmp/pinned.txt /tmp/documented.txt || true
            echo "::error::The package list in docs/dependencies.md differs from .github/ci/linux-packages.txt."
            exit 1
          fi
          echo "docs/dependencies.md lists the $(wc -l < /tmp/pinned.txt) pinned packages."

      # Now with Git, which the item-catalog generator needs.
      - name: Check out MMModern
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the unprivileged build user
        run: |
          set -euo pipefail
          useradd --create-home --shell /bin/bash builder
          chown -R builder: "$GITHUB_WORKSPACE"
          mkdir -p "$SCUMMVM_SOURCE" "$SCUMMVM_BUILD"
          chown builder: "$SCUMMVM_SOURCE" "$SCUMMVM_BUILD"
          echo "builder: uid $(id -u builder)"

      - name: Fetch ScummVM at the pinned commit
        run: |
          runuser -u builder -- bash -euo pipefail -c '
            git init --quiet "$SCUMMVM_SOURCE"
            git -C "$SCUMMVM_SOURCE" remote add origin https://github.com/scummvm/scummvm.git
            git -C "$SCUMMVM_SOURCE" fetch --depth 1 --no-tags origin "$SCUMMVM_COMMIT"
            git -C "$SCUMMVM_SOURCE" checkout --quiet --detach FETCH_HEAD
            head=$(git -C "$SCUMMVM_SOURCE" rev-parse HEAD)
            status=$(git -C "$SCUMMVM_SOURCE" status --porcelain)
            echo "ScummVM HEAD: $head"
            echo "ScummVM status --porcelain: ${status:-(empty)}"
            [ "$head" = "$SCUMMVM_COMMIT" ] || { echo "::error::ScummVM HEAD is not the pinned commit."; exit 1; }
            [ -z "$status" ] || { echo "::error::The ScummVM checkout is not clean."; exit 1; }'

      - name: Restore the ScummVM build
        id: scummvm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCUMMVM_BUILD }}
          key: scummvm-linux-${{ env.SCUMMVM_COMMIT }}-${{ hashFiles('.github/ci/linux-packages.txt', '.github/ci/scummvm.sh', '.github/ci/scummvm-use-linux.txt') }}

      - name: Configure ScummVM
        if: steps.scummvm-cache.outputs.cache-hit != 'true'
        run: runuser -u builder -- bash .github/ci/scummvm.sh configure "$SCUMMVM_SOURCE" "$SCUMMVM_BUILD"

      # The manual bundle workflow pins ScummVM too; both pins must agree.
      - name: Check the bundle workflow's ScummVM pin
        run: |
          set -euo pipefail
          pin=$(awk '$1 == "SCUMMVM_COMMIT:" { print $2 }' .github/workflows/linux-bundle.yml)
          [ "$pin" = "$SCUMMVM_COMMIT" ] || { echo "::error::.github/workflows/linux-bundle.yml pins ScummVM $pin, not $SCUMMVM_COMMIT."; exit 1; }
          echo "Both workflows pin ScummVM $pin."

      - name: Check the ScummVM USE_ set
        run: |
          set -euo pipefail
          chown -R builder: "$SCUMMVM_BUILD"
          { grep -E 'USE_' "$SCUMMVM_BUILD/config.h"; grep -E 'USE_' "$SCUMMVM_BUILD/config.mk"; } > /tmp/use-actual.txt
          grep -v '^##' .github/ci/scummvm-use-linux.txt > /tmp/use-expected.txt
          if ! cmp -s /tmp/use-expected.txt /tmp/use-actual.txt; then
            echo 'Only expected (<), only found (>):'
            diff /tmp/use-expected.txt /tmp/use-actual.txt || true
            echo "::error::ScummVM's USE_ set differs from .github/ci/scummvm-use-linux.txt."
            exit 1
          fi
          echo "ScummVM's USE_ set matches the recorded set; defined:"
          grep -E '^#define USE_' "$SCUMMVM_BUILD/config.h"
          # MMModern's configure compares the DEFINES of config.mk with
          # .github/ci/scummvm-defines-linux.txt and refuses any other entry.
          grep -E '^DEFINES' "$SCUMMVM_BUILD/config.mk"

      - name: Build the four ScummVM artifacts
        if: steps.scummvm-cache.outputs.cache-hit != 'true'
        run: runuser -u builder -- bash .github/ci/scummvm.sh build "$SCUMMVM_SOURCE" "$SCUMMVM_BUILD"

      - name: Save the ScummVM build
        if: steps.scummvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCUMMVM_BUILD }}
          key: ${{ steps.scummvm-cache.outputs.cache-primary-key }}

      - name: Show the toolchain
        run: |
          set -euo pipefail
          grep -E '^(PRETTY_NAME|VERSION_CODENAME)=' /etc/os-release
          echo "snapshot: $(awk '$1 == "snapshot" { print $2 }' .github/ci/linux-packages.txt)"
          gcc --version | head -n 1
          ld --version | head -n 1
          objcopy --version | head -n 1
          cmake --version | head -n 1
          echo "ninja $(ninja --version)"
          make --version | head -n 1
          echo "SDL2 $(sdl2-config --version)"
          echo "vorbisfile $(pkg-config --modversion vorbisfile)"
          git --version

      - name: Configure MMModern (as build-linux-rel, without original data)
        run: |
          runuser -u builder -- bash -euo pipefail -c '
            cmake -S . -B build-linux-rel -G Ninja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g" \
              "-DSCUMMVM_SOURCE_DIR=$SCUMMVM_SOURCE" \
              "-DSCUMMVM_BUILD_DIR=$SCUMMVM_BUILD" \
              -DMMODERN_ORIGINAL_DATA_TESTS=OFF
            if grep -qF NDEBUG build-linux-rel/build.ninja; then
              echo "::error::build-linux-rel/build.ninja contains NDEBUG."
              exit 1
            fi
            echo "build-linux-rel/build.ninja contains no NDEBUG."'

      - name: Build MMModern
        run: |
          runuser -u builder -- bash -euo pipefail -c '
            cmake --build build-linux-rel
            # The EXCLUDE_FROM_ALL targets, so every documented target compiles;
            # CMakeLists.txt points here where it defines them.
            cmake --build build-linux-rel --target mmodern_test_save mmodern_dos_export mmodern_m44_baseline_witness mmodern_m44_baseline_restart'

      - name: Show the shared libraries of mmodern
        run: ldd build-linux-rel/mmodern

      - name: Run the tests
        run: runuser -u builder -- ctest --test-dir build-linux-rel --output-on-failure --no-tests=error -j "$(nproc)"

      - name: Upload the CTest logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-logs-linux
          path: build-linux-rel/Testing/Temporary/
          retention-days: 7
          if-no-files-found: ignore
